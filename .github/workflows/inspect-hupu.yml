name: Inspect Hupu game page structure
on:
  push:
    branches:
      - inspect-hupu-source
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Fetch public page and inspect frontend assets
        shell: bash
        run: |
          python - <<'PY'
          import urllib.request, urllib.error, re, json, html, hashlib, urllib.parse
          URL = "https://activity-static.hupu.com/shaper/published/app_4762e3ab42/index.html?night=0"
          req = urllib.request.Request(URL, headers={
              "User-Agent": "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/131.0.0.0 Safari/537.36",
              "Accept": "text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8",
              "Accept-Language": "zh-CN,zh;q=0.9,en;q=0.8"
          })
          try:
              with urllib.request.urlopen(req, timeout=20) as r:
                  page = r.read(25000000)
                  print("HTTP_STATUS", r.status)
                  print("FINAL_URL", r.url)
                  print("CONTENT_TYPE", r.headers.get("Content-Type"))
          except Exception as exc:
              print("FETCH_ERROR", repr(exc))
              raise SystemExit(0)
          text = page.decode("utf-8", errors="replace")
          print("HTML_BYTES",len(page))
          print("HTML_SHA256",hashlib.sha256(page).hexdigest())
          titles=re.findall(r"<title[^>]*>(.*?)</title>",text,re.S|re.I)
          print("TITLE",html.unescape(titles[0].strip()) if titles else None)
          scripts=re.findall(r'<script\\b[^>]*\\bsrc=["\\\']([^"\\\']+)',text,re.I)
          styles=re.findall(r'<link\\b[^>]*\\bhref=["\\\']([^"\\\']+)',text,re.I)
          inline=re.findall(r'<script\\b[^>]*>(.*?)</script>',text,re.S|re.I)
          print("EXTERNAL_SCRIPT_COUNT",len(scripts))
          print("EXTERNAL_SCRIPTS",json.dumps(scripts[:30],ensure_ascii=False))
          print("LINK_HREFS",json.dumps(styles[:30],ensure_ascii=False))
          print("INLINE_SCRIPT_LENGTHS",json.dumps([len(v) for v in inline]))
          print("HAS_REACT",bool(re.search(r"react|__NEXT_DATA__|__webpack_require__|vite",text,re.I)))
          for phrase in ["金牌经纪人","1984","1996","乔丹","奥拉朱旺","购买球队","GOAT","createRoot","localStorage","fetch("]:
              loc=text.find(phrase)
              print("KEYWORD",phrase,"hits",text.count(phrase),"first_position",loc)
          for src in scripts[:12]:
              target=urllib.parse.urljoin(URL,src)
              try:
                  rq=urllib.request.Request(target,headers={"User-Agent":"Mozilla/5.0"})
                  with urllib.request.urlopen(rq,timeout=15) as r:
                      chunk=r.read(12000000)
                      print("ASSET",json.dumps({"url":target,"status":r.status,"bytes_read":len(chunk),"sha256":hashlib.sha256(chunk).hexdigest()},ensure_ascii=False))
              except Exception as exc:
                  print("ASSET_ERROR",target,repr(exc))
          PY
